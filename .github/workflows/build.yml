name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 PyQt6-WebEngine

      - name: Build
        run: |
          pyinstaller --noconfirm --clean --windowed --noconsole --onefile `
            --name NEXUS `
            --add-data "sounds;sounds" `
            --hidden-import PyQt6.QtWebEngineWidgets `
            nexus_ps5.py

      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-windows
          path: dist/NEXUS.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 PyQt6-WebEngine

      - name: Build
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir \
            --name NEXUS \
            --add-data "sounds:sounds" \
            --hidden-import PyQt6.QtWebEngineWidgets \
            nexus_ps5.py
          if [ -d dist/NEXUS.app ]; then
            ditto -c -k --sequesterRsrc --keepParent dist/NEXUS.app dist/NEXUS-macos.zip
          else
            (cd dist && zip -r NEXUS-macos.zip NEXUS)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-macos
          path: dist/NEXUS-macos.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 PyQt6-WebEngine

      - name: Build
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir \
            --name NEXUS \
            --add-data "sounds:sounds" \
            --hidden-import PyQt6.QtWebEngineWidgets \
            nexus_ps5.py
          (cd dist && tar -czf NEXUS-linux.tar.gz NEXUS)

      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-linux
          path: dist/NEXUS-linux.tar.gz

  release:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.tar.gz' \) \
            -exec cp -v {} release/ \;
          ls -la release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
